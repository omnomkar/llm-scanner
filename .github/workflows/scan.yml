name: LLM Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/test_aggregator.py -v

  scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start vulnerable target
        run: |
          python target/app.py &
          sleep 3

      # The target is deliberately vulnerable, so the scanner is EXPECTED to
      # find criticals and exit 1. continue-on-error lets the run keep going so
      # the next step can assert on that outcome; without it the job would fail
      # here and the assertion would never execute.
      - name: Run scanner against deliberately vulnerable target — expected exit 1
        id: scan
        continue-on-error: true
        run: python -m scanner.main --no-color

      - name: Verify scanner exited 1 (critical findings expected)
        run: |
          if [ "${{ steps.scan.outcome }}" = "failure" ]; then
            echo "Scanner exited non-zero as expected — severity gate fired."
          else
            echo "::error::Scanner exited 0 against the vulnerable target."
            echo "The severity gate did not fire. Either detection regressed or"
            echo "the target is no longer vulnerable."
            exit 1
          fi

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: reports/report_*.md
